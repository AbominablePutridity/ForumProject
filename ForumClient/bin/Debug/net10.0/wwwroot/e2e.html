<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><title>e2e</title><script src="js/api.js"></script></head>
<body>
<script>
(async function () {
    var res = [];
    try {
        var login = await api('auth.login', { login: '1234', password: '1234' });
        var uid = login && login.user && login.user.id;
        res.push('LOGIN=OK uid=' + uid);
    } catch (e) { res.push('LOGIN=ERR ' + encodeURIComponent(String(e))); }

    try {
        var feed = await api('feed', {});
        var n = Array.isArray(feed) ? feed.length : (feed && feed.posts ? Object.keys(feed.posts).length : '?');
        res.push('FEED=OK n=' + n);
    } catch (e) { res.push('FEED=ERR ' + encodeURIComponent(String(e))); }

    window.open('https://jcore.result/E2E:' + encodeURIComponent(res.join('|')), '_blank');
})();
</script>
</body>
</html>
