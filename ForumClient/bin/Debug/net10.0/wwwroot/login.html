<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Вход — JCore Forum</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <div class="card form-card">
            <div class="auth-logo">JCore Forum</div>
            <p class="subtitle" style="text-align:center">Войдите, чтобы читать ленту и обсуждать посты</p>

            <div id="alert" class="alert"></div>

            <form id="login-form">
                <div class="field">
                    <label for="login">Логин</label>
                    <input type="text" id="login" autocomplete="username" required maxlength="100">
                </div>

                <div class="field">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" autocomplete="current-password" required>
                </div>

                <button class="btn btn-primary" type="submit" id="submit-btn" style="width:100%;justify-content:center">
                    Войти
                </button>
            </form>

            <p class="muted" style="text-align:center;margin-top:16px">
                Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
            </p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        const alertBox = document.getElementById('alert');

        function fail(message) {
            alertBox.className = 'alert alert-error';
            alertBox.textContent = message;
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            alertBox.className = 'alert';

            const login = document.getElementById('login').value.trim();
            const password = document.getElementById('password').value;

            try {
                await api('auth.login', { login, password });
                await rememberCredentials(login, password);
                location.href = 'feed.html';
            } catch (err) {
                fail(err.message);
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
